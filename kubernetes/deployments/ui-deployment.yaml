apiVersion: apps/v1
kind: Deployment
metadata:
  name: aidev-ui
  labels:
    app: aidev-ui
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aidev-ui
  template:
    metadata:
      labels:
        app: aidev-ui
        tier: frontend
    spec:
      containers:
      - name: ui
        image: aidev-platform/ui:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: NEXT_PUBLIC_API_URL
          value: "http://aidev-api-service:3001"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: aidev-ui-service
  labels:
    app: aidev-ui
spec:
  type: LoadBalancer
  selector:
    app: aidev-ui
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
